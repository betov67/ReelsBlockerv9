name: Build Android APK v9
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle*" -type f | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          # Если есть gradlew, используем его, иначе используем системный gradle
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            chmod +x ../gradlew 2>/dev/null || true
            gradle assembleDebug
          fi
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelsBlocker-v9-APK
          path: '**/build/outputs/apk/debug/*.apk'
