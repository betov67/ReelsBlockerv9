name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate sdkmanager and add it to PATH
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER_PATH=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "sdkmanager not found under ANDROID_HOME/ANDROID_SDK_ROOT"
            exit 1
          fi
          echo "Found sdkmanager at: $SDKMANAGER_PATH"
          echo "$(dirname "$SDKMANAGER_PATH")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: List available SDK platform/build-tools packages (diagnostic)
        run: sdkmanager --list 2>&1 | grep -iE "platforms;android-3|build-tools;3" | tee sdk_list.log || true

      - name: Install required SDK platform & build-tools
        run: |
          set -o pipefail
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools" 2>&1 | tee sdk_install.log

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ReelsBlocker-v9-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload diagnostic logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-logs
          path: |
            sdk_list.log
            sdk_install.log
            gradle_build.log
          if-no-files-found: ignore
