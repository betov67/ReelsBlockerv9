name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate sdkmanager and add it to PATH
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER_PATH=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "sdkmanager not found under ANDROID_HOME/ANDROID_SDK_ROOT"
            exit 1
          fi
          echo "Found sdkmanager at: $SDKMANAGER_PATH"
          echo "$(dirname "$SDKMANAGER_PATH")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: List available SDK platform/build-tools packages (diagnostic)
        run: sdkmanager --list 2>&1 | grep -iE "platforms;android-3|build-tools;3" | tee /tmp/sdk_list.log || true

      - name: Install required SDK platform & build-tools
        run: |
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1 | tee /tmp/sdk_install.log

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_build.log

      # Actions artifact/log downloads route through Azure Blob Storage,
      # which isn't reachable from the machine driving this workflow. So
      # instead of actions/upload-artifact, publish everything (logs, and
      # the APK if it built) straight into a plain git branch, which is
      # fetched back over ordinary git — no blob storage involved.
      - name: Publish logs (and APK, if built) to the ci-output branch
        if: always()
        run: |
          set +e
          mkdir -p /tmp/ci-output
          cp /tmp/sdk_list.log /tmp/ci-output/ 2>/dev/null
          cp /tmp/sdk_install.log /tmp/ci-output/ 2>/dev/null
          cp /tmp/gradle_build.log /tmp/ci-output/ 2>/dev/null
          cp app/build/outputs/apk/debug/*.apk /tmp/ci-output/ 2>/dev/null
          echo "run_id=$GITHUB_RUN_ID run_number=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA" > /tmp/ci-output/run_info.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin ci-output 2>/dev/null
          if git show-ref --verify --quiet refs/remotes/origin/ci-output; then
            git checkout -B ci-output origin/ci-output
          else
            git checkout --orphan ci-output
            git rm -rf . > /dev/null 2>&1
          fi

          rm -rf ci-output
          mkdir -p ci-output
          cp /tmp/ci-output/* ci-output/ 2>/dev/null

          git add ci-output
          git commit -m "CI output for run ${GITHUB_RUN_ID}" || echo "Nothing new to commit"
          git push origin ci-output --force
