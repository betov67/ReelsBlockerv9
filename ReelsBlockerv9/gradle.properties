# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run Gradle tasks in parallel where possible.
org.gradle.parallel=true

# Enable the Gradle build cache.
org.gradle.caching=true

# AndroidX package structure, required for all modern Android projects.
android.useAndroidX=true

# Kotlin code style used by IDE formatters that read this project.
kotlin.code.style=official

# Disable build features project-wide by default; the app module opts in to
# only what it needs (see app/build.gradle.kts).
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
